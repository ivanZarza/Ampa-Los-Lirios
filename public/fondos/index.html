function regFromDb(r){return{id:r.id,fondo:r.fondo,tipo:r.tipo,cantidad:Number(r.cantidad),descripcion:r.descripcion,
  nombrePersona:r.nombre_persona||'',categoriaId:r.categoria_id,perfilId:r.perfil_id,

  creadoEn:r.creado_en,modificadoEn:r.modificado_en}}
function regToDb(r){return{id:r.id,fondo:r.fondo,tipo:r.tipo,cantidad:r.cantidad,descripcion:r.descripcion,
  nombre_persona:r.nombrePersona||'',categoria_id:r.categoriaId||null,perfil_id:r.perfilId,
  tiene_ticket:r.tieneTicket,ticket_foto_url:r.ticketFoto||null,transferencia_par:r.transferenciaPar||null,
  creado_en:r.creadoEn,modificado_en:r.modificadoEn}}
function audFromDb(a){return{id:a.id,registroId:a.registro_id,perfilNombre:a.perfil_nombre,accion:a.accion,
  descripcion:a.descripcion,datosAnteriores:a.datos_anteriores,datosNuevos:a.datos_nuevos,creadoEn:a.creado_en}}
function audToDb(a){return{id:a.id,registro_id:a.registroId,perfil_nombre:a.perfilNombre,accion:a.accion,
  descripcion:a.descripcion,datos_anteriores:a.datosAnteriores||null,datos_nuevos:a.datosNuevos||null,creado_en:a.creadoEn}}
function perFromDb(p){return{id:p.id,nombre:p.nombre,pin:p.pin,rol:p.rol,creadoEn:p.creado_en}}
function perToDb(p){return{id:p.id,nombre:p.nombre,pin:p.pin,rol:p.rol,creado_en:p.creadoEn}}

// ─── Data: Load & Save ───────────────────────────────────────────────────────
function cacheLocal(){try{localStorage.setItem('ampa_data',JSON.stringify(D))}catch(e){}}
function loadLocal(){try{const r=localStorage.getItem('ampa_data');if(r){const d=JSON.parse(r);D.perfiles=d.perfiles||[];D.registros=d.registros||[];D.categorias=d.categorias||[];D.auditoria=d.auditoria||[];return true}}catch(e){}return false}

async function syncFromDb(){
  try{
    const [p,r,c,a]=await Promise.all([
      sb.from('fondos_perfiles').select('*'),
      sb.from('fondos_registros').select('*'),
      sb.from('fondos_categorias').select('*'),
      sb.from('fondos_auditoria').select('*').order('creado_en',{ascending:false}).limit(200)
    ]);
    if(p.error||r.error||c.error||a.error)throw new Error('DB error');
    D.perfiles=p.data.map(perFromDb);
    D.registros=r.data.map(regFromDb);
    D.categorias=c.data.map(catFromDb);
    D.auditoria=a.data.map(audFromDb);
    online=true;cacheLocal();return true;
  }catch(e){online=false;return false}
}

async function dbInsertReg(reg){const{error}=await sb.from('fondos_registros').insert(regToDb(reg));if(error)toast('Error al sincronizar','error')}
async function dbUpdateReg(reg){const{error}=await sb.from('fondos_registros').update(regToDb(reg)).eq('id',reg.id);if(error)toast('Error al sincronizar','error')}
async function dbDeleteReg(id){const{error}=await sb.from('fondos_registros').delete().eq('id',id);if(error)toast('Error al sincronizar','error')}

async function dbInsertPer(p){const{error}=await sb.from('fondos_perfiles').insert(perToDb(p));if(error)toast('Error al sincronizar','error')}

async function dbInsertCat(c){const{error}=await sb.from('fondos_categorias').insert(c);if(error)toast('Error al sincronizar','error')}
async function dbUpdateCat(c){const{error}=await sb.from('fondos_categorias').update(c).eq('id',c.id);if(error)toast('Error al sincronizar','error')}
async function dbDeleteCat(id){const{error}=await sb.from('fondos_categorias').delete().eq('id',id);if(error)toast('Error al sincronizar','error')}

async function dbInsertAud(a){await sb.from('fondos_auditoria').insert(audToDb(a)).catch(()=>{})}

async function uploadTicket(file){
  const ext=file.name.split('.').pop()||'jpg';
  const path=`tickets/${uid()}.${ext}`;
  const{error}=await sb.storage.from('fondos-tickets').upload(path,file,{contentType:file.type});
  if(error){toast('Error subiendo foto','error');return null}
  const{data}=sb.storage.from('fondos-tickets').getPublicUrl(path);
  return data.publicUrl;
}

function fileToBase64(file){
  return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{
    const du=r.result;const i=du.indexOf(',')+1;res(du.slice(i))};r.onerror=rej;r.readAsDataURL(file)})
}
function resizeImage(file,maxW=1200){
  return new Promise(res=>{const img=new Image();img.onload=()=>{
    let w=img.width,h=img.height;if(w>maxW){h=Math.round(h*maxW/w);w=maxW}
    const c=document.createElement('canvas');c.width=w;c.height=h;
    c.getContext('2d').drawImage(img,0,0,w,h);
    c.toBlob(b=>res(b||file),'image/jpeg',0.8)};
    img.src=URL.createObjectURL(file)})
}
async function extractTicketData(file){
  try{
    const small=await resizeImage(file);
    const b64=await fileToBase64(small);
    const{data,error}=await sb.functions.invoke('extract-ticket',{body:{image:b64,mediaType:'image/jpeg'}});
    if(error){toast('Error conectando con IA: '+error.message,'error');return null}
    if(data&&data.error){toast('IA: '+data.error,'error');return null}
    return data;
  }catch(e){toast('Error leyendo ticket: '+e.message,'error');return null}
}

// ─── Realtime ────────────────────────────────────────────────────────────────
function setupRealtime(){
  sb.channel('fondos-sync')
    .on('postgres_changes',{event:'*',schema:'public',table:'fondos_registros'},()=>refreshData())
    .on('postgres_changes',{event:'*',schema:'public',table:'fondos_perfiles'},()=>refreshData())
    .on('postgres_changes',{event:'*',schema:'public',table:'fondos_categorias'},()=>refreshData())
    .on('postgres_changes',{event:'*',schema:'public',table:'fondos_auditoria'},()=>refreshData())
    .subscribe();
}
async function refreshData(){await syncFromDb();route()}

// ─── Helpers ─────────────────────────────────────────────────────────────────
function perfil(){return D.perfiles.find(p=>p.id===perfActivo)||null}
function saldo(f){return D.registros.filter(r=>r.fondo===f).reduce((s,r)=>s+(r.tipo==='entrada'?r.cantidad:-r.cantidad),0)}
function pendientes(){return D.registros.filter(r=>r.tipo==='salida'&&!r.tieneTicket)}
function fmt(n){return n.toLocaleString('es-ES',{style:'currency',currency:'EUR'})}
function fmtD(iso){return new Date(iso).toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric'})}
function fmtT(iso){return new Date(iso).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})}
function fmtDT(iso){return fmtD(iso)+' '+fmtT(iso)}

function audit(accion,regId,desc,antes=null,despues=null){
  const a={id:uid(),registroId:regId,perfilNombre:perfil()?.nombre||'Sistema',accion,descripcion:desc,datosAnteriores:antes,datosNuevos:despues,creadoEn:new Date().toISOString()};
  D.auditoria.unshift(a);cacheLocal();dbInsertAud(a);
}

// ─── UI ──────────────────────────────────────────────────────────────────────
function toast(msg,type='info'){
  const root=$('#toast-root');
  const c={success:'bg-verde-600',error:'bg-red-500',info:'bg-gray-800'}[type];
  const el=document.createElement('div');
  el.className=`toast ${c} text-white px-4 py-3 rounded-xl shadow-lg text-center text-sm font-medium`;
  el.textContent=msg;root.appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .3s';setTimeout(()=>el.remove(),300)},3000);
}
function modal(html){
  const root=$('#modal-root');
  root.innerHTML=`<div class="fixed inset-0 z-[100] bg-black/50 flex items-end sm:items-center justify-center" id="mbg">
    <div class="modal-sheet bg-white w-full sm:max-w-md sm:rounded-xl rounded-t-2xl max-h-[90vh] overflow-y-auto p-6" id="mbox">${html}</div></div>`;
  $('#mbg').onclick=e=>{if(e.target.id==='mbg')closeM()};
}
function closeM(){$('#modal-root').innerHTML=''}
function confirmDlg(title,msg,btnTxt,onOk,danger=false){
  modal(`<h3 class="text-lg font-bold mb-2">${title}</h3><p class="text-gray-600 mb-6">${msg}</p>
    <div class="flex gap-3"><button class="flex-1 rounded-lg font-semibold py-3 bg-gray-200 text-gray-800 active:scale-95 transition-transform" id="mc">Cancelar</button>
    <button class="flex-1 rounded-lg font-semibold py-3 ${danger?'bg-red-500':'bg-verde-600'} text-white active:scale-95 transition-transform" id="mok">${btnTxt}</button></div>`);
  $('#mc').onclick=closeM;$('#mok').onclick=()=>{closeM();onOk()};
}

// ─── Records List ────────────────────────────────────────────────────────────
function regList(regs,showFondo=false){
  if(!regs.length)return '<p class="text-center text-gray-400 py-8">No hay movimientos</p>';
  return `<div class="bg-white rounded-xl shadow-sm border border-gray-100 divide-y divide-gray-100">${regs.map(r=>{
    const isE=r.tipo==='entrada';const cat=r.categoriaId?D.categorias.find(c=>c.id===r.categoriaId):null;
    const p=D.perfiles.find(x=>x.id===r.perfilId);const f=FONDOS[r.fondo];
    return `<a href="#/registro/${r.id}" class="flex items-center gap-3 py-3 px-4 block">
      <div class="w-10 h-10 rounded-full flex items-center justify-center text-lg flex-shrink-0 ${isE?'bg-verde-100':'bg-red-100'}">${isE?'↓':'↑'}</div>
      <div class="flex-1 min-w-0"><p class="font-medium truncate">${r.descripcion}</p>
        <p class="text-xs text-gray-400">${fmtDT(r.creadoEn)}${showFondo?' · '+(f?.nombre||r.fondo):''}${cat?' · '+cat.nombre:''}${p?' · '+p.nombre:''}</p></div>
      <div class="text-right flex-shrink-0"><p class="font-bold ${isE?'text-verde-600':'text-red-500'}">${isE?'+':'−'}${fmt(r.cantidad)}</p>
        ${!isE&&!r.tieneTicket?'<span class="inline-flex items-center justify-center rounded-full text-[10px] font-bold bg-red-500 text-white px-1.5 h-5">Sin ticket</span>':''}</div></a>`;
  }).join('')}</div>`;
}

  let pin='';
  function render(){
    app().innerHTML=`<div class="min-h-screen flex flex-col items-center justify-center bg-gradient-to-b from-verde-700 to-verde-900 px-6">
      <div class="text-center mb-8"><div class="text-5xl mb-3">🏫</div><h1 class="text-2xl font-bold text-white">AMPA Los Lirios</h1>
        <p class="text-verde-200 text-sm mt-1">Gestión de Fondos</p></div>
      <div class="flex gap-3 mb-8" id="dots">${[0,1,2,3].map(i=>`<div class="w-4 h-4 rounded-full border-2 border-verde-400 pin-dot ${i<pin.length?'filled bg-verde-500 border-verde-500':''}"></div>`).join('')}</div>
      <div id="pin-err" class="text-red-300 text-sm mb-4 h-5"></div>
      <div class="grid grid-cols-3 gap-3 w-full max-w-[280px]">
        ${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="bg-white/20 text-white text-2xl font-semibold rounded-xl h-16 active:bg-white/30 transition" data-n="${n}">${n}</button>`).join('')}
        <div></div><button class="bg-white/20 text-white text-2xl font-semibold rounded-xl h-16 active:bg-white/30 transition" data-n="0">0</button>
        <button class="bg-white/10 text-white text-xl rounded-xl h-16 active:bg-white/20 transition" id="pdel">⌫</button>
      </div></div>`;
    app().querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{
      if(pin.length>=4)return;pin+=b.dataset.n;upDots();if(pin.length===4)tryL();
    });
    $('#pdel').onclick=()=>{pin=pin.slice(0,-1);upDots();$('#pin-err').textContent=''}
  }
  function upDots(){document.querySelectorAll('.pin-dot').forEach((d,i)=>{
    d.classList.toggle('filled',i<pin.length);d.classList.toggle('bg-verde-500',i<pin.length);d.classList.toggle('border-verde-500',i<pin.length)})}
  function tryL(){
    const p=D.perfiles.find(x=>x.pin===pin);
    if(p){perfActivo=p.id;try{localStorage.setItem('ampa_pa',p.id)}catch(e){}go('/dashboard')}
    else{$('#pin-err').textContent='PIN incorrecto';pin='';setTimeout(upDots,200)}
  }
  render();
}

        cat?'"'+cat+'"':'',p,r.tipo==='salida'?(r.tieneTicket?'Sí':'PENDIENTE'):''].join(';')});

    <main class="flex-1 overflow-y-auto p-4 space-y-2" style="padding-bottom:2rem">
      ${!entries.length?'<p class="text-center text-gray-400 py-8">Sin entradas</p>':''}
      ${entries.map(e=>`<div class="bg-white rounded-xl shadow-sm border p-4">
        <div class="flex items-start justify-between">
          <div><span class="text-xs font-medium px-2 py-0.5 rounded ${e.accion==='crear'?'bg-verde-100 text-verde-700':e.accion==='modificar'?'bg-blue-100 text-blue-700':'bg-red-100 text-red-700'}">${e.accion}</span>
            <span class="text-xs text-gray-400 ml-2">${e.perfilNombre}</span></div>
          <span class="text-xs text-gray-400">${fmtDT(e.creadoEn)}</span></div>
        <p class="text-sm mt-2">${e.descripcion}</p></div>`).join('')}</main>`;
}

// ─── Router ──────────────────────────────────────────────────────────────────
function go(path){location.hash=path}

function route(){
  const h=location.hash.slice(1)||'/';const parts=h.split('?')[0].split('/').filter(Boolean);
  const view=parts[0]||'login',p1=parts[1]||'',p2=parts[2]||'';

  if(view==='login'||view===''){
    if(perfActivo&&D.perfiles.some(p=>p.id===perfActivo)){go('/dashboard');return}
    vLogin();return;
  }
  if(!perfActivo||!D.perfiles.some(p=>p.id===perfActivo)){go('/');return}

  switch(view){
    case 'dashboard':vDash();break;
    case 'fondo':vFondo(p1);break;
    case 'nuevo':vNuevo(p1,p2);break;
    case 'registro':vReg(p1);break;
    case 'editar':vEditar(p1);break;
    case 'registros':vRegs();break;
    case 'categorias':vCats();break;
    case 'transferencia':vTransfer();break;
    case 'ajustes':vAjustes();break;
    case 'exportar':vExport();break;
    case 'auditoria':vAudit();break;
    default:go('/dashboard');
  }
}

// ─── Init ────────────────────────────────────────────────────────────────────
if('serviceWorker' in navigator){navigator.serviceWorker.register('/fondos/sw.js').catch(()=>{})}

loadLocal();
try{const s=localStorage.getItem('ampa_pa');if(s&&D.perfiles.some(p=>p.id===s))perfActivo=s}catch(e){}
window.addEventListener('hashchange',route);
route();

syncFromDb().then(ok=>{
  if(ok){
    try{const s=localStorage.getItem('ampa_pa');if(s&&D.perfiles.some(p=>p.id===s))perfActivo=s}catch(e){}
    route();
    setupRealtime();
  }
});
</script>
</body>
</html>
